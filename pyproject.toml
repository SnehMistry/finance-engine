[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-engine"
version = "1.0.0"
description = "Command-line personal finance and paycheck analyzer: validates a CSV of income and expenses and reports savings, deductions and spending warnings."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sneh Vinay Mistry" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
finance-engine = "finance_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["finance_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
